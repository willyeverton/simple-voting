simple_voting.settings:
  path: '/admin/config/simple-voting/settings'
  defaults:
    _form: '\Drupal\simple_voting\Form\VotingSettingsForm'
    _title: 'Simple Voting settings'
  requirements:
    _permission: 'administer simple voting'

simple_voting.questions:
  path: '/voting'
  defaults:
    _controller: '\Drupal\simple_voting\Controller\VotingPageController::listQuestions'
    _title: 'Voting questions'
  requirements:
    _permission: 'vote in polls'
    _user_is_logged_in: 'TRUE'

simple_voting.vote:
  path: '/voting/{question_id}'
  defaults:
    _controller: '\Drupal\simple_voting\Controller\VotingPageController::votePage'
    _title_callback: '\Drupal\simple_voting\Controller\VotingPageController::title'
  requirements:
    _permission: 'vote in polls'
    _user_is_logged_in: 'TRUE'
    question_id: '[a-z0-9][a-z0-9_]{1,127}'

simple_voting.results:
  path: '/voting/{question_id}/results'
  defaults:
    _controller: '\Drupal\simple_voting\Controller\VotingResultsController::results'
    _title_callback: '\Drupal\simple_voting\Controller\VotingResultsController::title'
  requirements:
    _custom_access: 'simple_voting.results_access:access'
    question_id: '[a-z0-9][a-z0-9_]{1,127}'

simple_voting.api.questions:
  path: '/api/v1/questions'
  defaults:
    _controller: '\Drupal\simple_voting\Controller\VotingApiController::listQuestions'
    _format: 'json'
  methods: [GET]
  options:
    _auth: ['basic_auth', 'cookie']
    _simple_voting_api: true
  requirements:
    _custom_access: 'simple_voting.api_access:access'

simple_voting.api.question:
  path: '/api/v1/questions/{question_id}'
  defaults:
    _controller: '\Drupal\simple_voting\Controller\VotingApiController::getQuestion'
    _format: 'json'
  methods: [GET]
  options:
    _auth: ['basic_auth', 'cookie']
    _simple_voting_api: true
  requirements:
    _custom_access: 'simple_voting.api_access:access'
    question_id: '[a-z0-9][a-z0-9_]{1,127}'

simple_voting.api.vote:
  path: '/api/v1/questions/{question_id}/votes'
  defaults:
    _controller: '\Drupal\simple_voting\Controller\VotingApiController::createVote'
    _format: 'json'
  methods: [POST]
  options:
    _auth: ['basic_auth', 'cookie']
    _csrf_request_header_token: 'TRUE'
    _simple_voting_api: true
  requirements:
    _custom_access: 'simple_voting.api_access:access'
    question_id: '[a-z0-9][a-z0-9_]{1,127}'

simple_voting.api.results:
  path: '/api/v1/questions/{question_id}/results'
  defaults:
    _controller: '\Drupal\simple_voting\Controller\VotingApiController::getResults'
    _format: 'json'
  methods: [GET]
  options:
    _auth: ['basic_auth', 'cookie']
    _simple_voting_api: true
  requirements:
    _custom_access: 'simple_voting.api_access:access'
    question_id: '[a-z0-9][a-z0-9_]{1,127}'
